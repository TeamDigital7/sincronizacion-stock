[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forus-stock-sync"
version = "0.1.0"
description = "Conciliación de stock entre BigQuery ERP y tiendas Shopify"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.25,<4",
  "google-auth>=2.35,<3",
  "pandas>=2.2,<3",
  "db-dtypes>=1.2,<2",
  "openpyxl>=3.1,<4",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_sync"]

[tool.poetry]
packages = [{ include = "stock_sync", from = "src" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
